# nginx site for BabyLog. Serves the built static app and proxies /api to the
# Node server. Adjust server_name and root to your setup.
#
# Install:
#   sudo cp deploy/nginx-baby.example.com.conf /etc/nginx/sites-available/baby.example.com
#   sudo ln -s /etc/nginx/sites-available/baby.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS (uses your existing certbot):
#   sudo certbot --nginx -d baby.example.com
# certbot rewrites this file to add the :443 block and an http->https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name baby.example.com;

    # Path to the built client (the repo's dist/ after `npm run build`).
    root /opt/baby-tracker/dist;
    index index.html;

    # API -> Node server on localhost.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Database import uploads the whole .db file:
        client_max_body_size 64m;
    }

    # Never cache the service worker or the shell entry.
    location = /sw.js        { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html   { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Hashed build assets can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
