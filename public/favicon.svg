<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- neobrutalist BABYLOG mark: magenta block, ink border, hard offset shadow, blocky B -->
  <rect x="6" y="6" width="23" height="23" fill="#0A090D"/>
  <rect x="3" y="3" width="23" height="23" fill="#FF5FA2" stroke="#0A090D" stroke-width="2.5"/>
  <g fill="#0A090D">
    <rect x="9"  y="8"    width="3"  height="16"/>  <!-- stem -->
    <rect x="9"  y="8"    width="10" height="3"/>   <!-- top bar -->
    <rect x="16" y="8"    width="3"  height="8"/>   <!-- upper bowl right -->
    <rect x="9"  y="13.5" width="10" height="3"/>   <!-- middle bar -->
    <rect x="16" y="15"   width="3"  height="9"/>   <!-- lower bowl right -->
    <rect x="9"  y="21"   width="11" height="3"/>   <!-- bottom bar -->
  </g>
</svg>
